# Zettaverse Agent Hub UI - nginx configuration
#
# Serves the built SPA and proxies API + WebSocket traffic to the backend.
#
# Configure the backend location at runtime via the environment variables:
#   BACKEND_HOST  - upstream host (default: host.docker.internal)
#   BACKEND_PORT  - upstream port (default: 8080)
#
# Example:
#   docker run -e BACKEND_HOST=agent-hub-backend -e BACKEND_PORT=8080 ...

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket console -> backend
    location /api/v1/ws {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
